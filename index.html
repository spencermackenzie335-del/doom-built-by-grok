function makeTex(draw, noise) {
  const c = document.createElement('canvas'); c.width = c.height = TS;
  const g = c.getContext('2d');
  draw(g);
  const d = g.getImageData(0, 0, TS, TS);
  if (noise) {
    const p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      if (p[i + 3] === 0) continue;
      const n = 1 + (Math.random() * 2 - 1) * noise;
      p[i] *= n; p[i + 1] *= n; p[i + 2] *= n;
    }
  }
  return new Uint32Array(d.data.buffer.slice(0));
}
// Every block starts as an original 16x16 drawing. Expanded 4x without filtering.
function blockTex(kind) {
 const small=document.createElement('canvas'); small.width=small.height=16;
 const g=small.getContext('2d'); let seed=kind.length*987+123;
 const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return (seed>>>0)/4294967296;};
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){
  let c=[113,116,120], v=(rand()-.5)*30;
  if(kind==='dirt'||kind==='grass') c=[120,80,43];
  if(kind==='grass' && y<3+((x*7)%3)) c=[77,139,45];
  if(kind==='planks') {c=[157,118,64];if(y%4===0|| (x+(y>>2)*5)%16===0)c=[94,67,34];}
  if(kind==='log') {c=[104,76,39]; if(x%4===0)c=[66,46,26];}
  if(kind==='bricks') {if(y%5===0||(x+(Math.floor(y/5)%2)*8)%16===0)c=[58,62,65];}
  if(kind==='cobble') {let edge=(x*3+y*7)%13<2||y%6===0; c=edge?[60,65,68]:[124,128,126];}
  if(kind==='diamond'||kind==='gold') {if((x*7+y*11)%19<4)c=kind==='diamond'?[48,226,222]:[242,193,43];}
  if(kind==='glow') c=(x*5+y*3)%7<2?[137,91,39]:[249,214,116];
  g.fillStyle=`rgb(${c.map(n=>clamp(n+v,0,255)|0).join(',')})`;g.fillRect(x,y,1,1);
 }
 return makeTex(g=>{g.imageSmoothingEnabled=false;g.drawImage(small,0,0,64,64);},0);
}

// ================= AUDIO =================
let AC = null, noiseB = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseB.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, f0, f1, ftype = 'lowpass') {
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseB;
  const fl = AC.createBiquadFilter(); fl.type = ftype;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + 0.02);
}
function sfx(n) {
  if (!AC) return;
  try {
    switch (n) {
      case 'shot': noise(0.4, 0.7, 2500, 150); tone('sine', 140, 40, 0.25, 0.5); break;
      case 'pump': tone('square', 300, 200, 0.05, 0.06, 0); tone('square', 250, 180, 0.05, 0.06, 0.12); break;
      case 'hurt': tone('sawtooth', 200, 70, 0.3, 0.25); break;
      case 'pick': tone('square', 520, 520, 0.07, 0.1); tone('square', 880, 880, 0.1, 0.1, 0.07); break;
      case 'die': tone('sawtooth', 320, 35, 0.7, 0.25); noise(0.5, 0.2, 800, 100); break;
      case 'pain': tone('sawtooth', 260, 140, 0.15, 0.15); break;
      case 'growl': tone('sawtooth', 110, 55, 0.5, 0.18); break;
      case 'fire': noise(0.45, 0.3, 900, 200, 'bandpass'); break;
      case 'claw': noise(0.12, 0.3, 3000, 600, 'highpass'); break;
      case 'door': tone('square', 60, 120, 0.5, 0.12); noise(0.5, 0.1, 400, 100); break;
      case 'click': tone('square', 1400, 1200, 0.03, 0.08); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.18, 0.1, i * 0.15)); break;
      case 'death': tone('sawtooth', 220, 30, 1.2, 0.3); break;
    }
  } catch (e) { }
}

function purchaseSkill(i){if(i<0||i>=12||skills[i]||skillPoints<1||(i%4!==0&&!skills[i-1]))return false;skillPoints--;skills[i]=true;if(i===4)player.hp+=35;if(i===6)player.armor=Math.min(150,player.armor+50);sfx('pick');return true;}

function collect(it){
 if(it.type==='health'){if(player.hp>=maxHP())return false;player.hp=Math.min(maxHP(),player.hp+30);}

}

function solid(x, y) {
  const mx = Math.floor(x), my = Math.floor(y);
  if (mx < 0 || my < 0 || mx >= MW || my >= MH) return true;
  return grid[my * MW + mx] !== 0;
}
function blocked(x, y, r) {
  if (npc && Math.abs(x - npc.x) < r + 0.3 && Math.abs(y - npc.y) < r + 0.3) return true;
  if(villagers.some(v=>Math.abs(x-v.x)<r+.28&&Math.abs(y-v.y)<r+.28))return true;
  return solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r);
}
function moveEnt(e, dx, dy, r) {
  if (!blocked(e.x + dx, e.y, r)) e.x += dx;
  if (!blocked(e.x, e.y + dy, r)) e.y += dy;
}
function los(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy), n = Math.ceil(d / 0.1);
  for (let i = 1; i < n; i++) { if (solid(x0 + dx * i / n, y0 + dy * i / n)) return false; }
  return true;
}
let rSide = 0, rTile = 0;
function cast(ox, oy, dx, dy) { // DDA; returns perpendicular distance (in units of |dir|)
  let mx = Math.floor(ox), my = Math.floor(oy);
  const ddx = dx === 0 ? 1e30 : Math.abs(1 / dx), ddy = dy === 0 ? 1e30 : Math.abs(1 / dy);
  let sx, sy, sdx, sdy;
  if (dx < 0) { sx = -1; sdx = (ox - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - ox) * ddx; }
  if (dy < 0) { sy = -1; sdy = (oy - my) * ddy; } else { sy = 1; sdy = (my + 1 - oy) * ddy; }
  let side = 0, t = 0;
  for (let i = 0; i < 80; i++) {
    if (sdx < sdy) { sdx += ddx; mx += sx; side = 0; } else { sdy += ddy; my += sy; side = 1; }
    if (mx < 0 || my < 0 || mx >= MW || my >= MH) { t = 1; break; }
    t = grid[my * MW + mx]; if (t) break;
  }
  rSide = side; rTile = t || 1;
  return side === 0 ? sdx - ddx : sdy - ddy;
}

function render(cam) {
  const dirX = Math.cos(cam.a), dirY = Math.sin(cam.a);
  const plX = -dirY * PLANE, plY = dirX * PLANE;
  // floor & ceiling
  const r0x = dirX - plX, r0y = dirY - plY, r1x = dirX + plX, r1y = dirY + plY;
  for (let y = HALF; y < VH; y++) {
    const rowDist = (PROJ * 0.5) / (y - HALF + 0.5);
    const stx = rowDist * (r1x - r0x) / W, sty = rowDist * (r1y - r0y) / W;
    let fx = cam.x + rowDist * r0x, fy = cam.y + rowDist * r0y;
    const s = clamp(1.1 - rowDist / 11, 0.06, 1);
    const fRow = y * W, cRow = (VH - 1 - y) * W;
    for (let x = 0; x < W; x++) {
      const cx = Math.floor(fx), cy = Math.floor(fy);
      const ti = (((fy - cy) * TS) & 63) * TS + (((fx - cx) * TS) & 63);
      let c = (cx === exitX && cy === exitY) ? texExit[ti] : (cx<11&&cy<11?BLOCKS.planks:((Math.floor(cx/11)+Math.floor(cy/11))%3===0?BLOCKS.dirt:texFloor))[ti];
      buf[fRow + x] = 0xff000000 | (((c >> 16 & 255) * s) << 16) | (((c >> 8 & 255) * s) << 8) | ((c & 255) * s);
      const lit=((cx * 7 + cy * 3) % 5 === 0);
      c = lit ? texCeilLight[ti] : texCeil[ti];

// ================= MAIN LOOP =================
let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsAcc += dt; fpsN++; if (fpsAcc >= 1) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  titleT += dt;
  if (state === 'play') update(dt);
  else if (state !== 'title') { // keep projectiles & flashes fading on end screens
    hurtFlash = Math.max(0, hurtFlash - dt); weapon.flash -= dt;
  }
  if (state === 'title') {
    render({ x: 6.5, y: 6.5, a: titleT * 0.15 });
    drawHUD(); drawTitle();
  } else {
    render(player);
    if (state !== 'dead' && state !== 'shop') drawWeapon();
    if (state === 'play') drawCrosshair();
    if (hurtFlash > 0) { ctx.fillStyle = `rgba(255,0,0,${hurtFlash * 0.5})`; ctx.fillRect(0, 0, W, VH); }
    if (pickFlash > 0) { ctx.fillStyle = `rgba(255,230,80,${pickFlash * 0.4})`; ctx.fillRect(0, 0, W, VH); }
    if (showMap) drawMinimap();
    if (msgT > 0 && state === 'play') { ctx.font = 'bold 13px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#000'; ctx.fillText(msgText, 9, 19); ctx.fillStyle = '#ff5040'; ctx.fillText(msgText, 8, 18); }
    if (state === 'play' && document.pointerLockElement !== cv) { ctx.font = '11px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#aaa'; ctx.fillText('click to capture mouse', W - 8, VH - 8); }
    drawHUD();
    if (state === 'dead') drawEnd(false);
    if (state === 'win') drawEnd(true);
    if (state === 'shop') drawShop();
    if(state==='skills')drawSkills();
    if(state==='dialogue')drawDialogue();
  }
  if(state==='leaderboard')drawLeaderboard();
  requestAnimationFrame(loop);
}
