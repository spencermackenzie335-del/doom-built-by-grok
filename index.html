// ================= AUDIO =================
let AC = null, noiseB = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseB.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, f0, f1, ftype = 'lowpass') {
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseB;
  const fl = AC.createBiquadFilter(); fl.type = ftype;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + 0.02);
}
function sfx(n) {
  if (!AC) return;
  try {
    switch (n) {
      case 'shot': noise(0.4, 0.7, 2500, 150); tone('sine', 140, 40, 0.25, 0.5); break;
      case 'pump': tone('square', 300, 200, 0.05, 0.06, 0); tone('square', 250, 180, 0.05, 0.06, 0.12); break;
      case 'hurt': tone('sawtooth', 200, 70, 0.3, 0.25); break;
      case 'pick': tone('square', 520, 520, 0.07, 0.1); tone('square', 880, 880, 0.1, 0.1, 0.07); break;
      case 'die': tone('sawtooth', 320, 35, 0.7, 0.25); noise(0.5, 0.2, 800, 100); break;
      case 'pain': tone('sawtooth', 260, 140, 0.15, 0.15); break;
      case 'growl': tone('sawtooth', 110, 55, 0.5, 0.18); break;
      case 'fire': noise(0.45, 0.3, 900, 200, 'bandpass'); break;
      case 'claw': noise(0.12, 0.3, 3000, 600, 'highpass'); break;
      case 'door': tone('square', 60, 120, 0.5, 0.12); noise(0.5, 0.1, 400, 100); break;
      case 'click': tone('square', 1400, 1200, 0.03, 0.08); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.18, 0.1, i * 0.15)); break;
      case 'death': tone('sawtooth', 220, 30, 1.2, 0.3); break;
    }
  } catch (e) { }
}

function solid(x, y) {
  const mx = Math.floor(x), my = Math.floor(y);
  if (mx < 0 || my < 0 || mx >= MW || my >= MH) return true;
  const t = grid[my * MW + mx];
  if (!t) return false;
  if (t === 15 && openDoors.has(my * MW + mx)) return false;
  return true;
}
function blocked(x, y, r) {
  if (npc && Math.abs(x - npc.x) < r + 0.3 && Math.abs(y - npc.y) < r + 0.3) return true;
  if(villagers.some(v=>Math.abs(x-v.x)<r+.28&&Math.abs(y-v.y)<r+.28))return true;
  return solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r);
}
function moveEnt(e, dx, dy, r) {
  if (!blocked(e.x + dx, e.y, r)) e.x += dx;
  if (!blocked(e.x, e.y + dy, r)) e.y += dy;
}
function los(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy), n = Math.ceil(d / 0.1);
  for (let i = 1; i < n; i++) { if (solid(x0 + dx * i / n, y0 + dy * i / n)) return false; }
  return true;
}
let rSide = 0, rTile = 0;
function cast(ox, oy, dx, dy) { // DDA; returns perpendicular distance (in units of |dir|)
  let mx = Math.floor(ox), my = Math.floor(oy);
  const ddx = dx === 0 ? 1e30 : Math.abs(1 / dx), ddy = dy === 0 ? 1e30 : Math.abs(1 / dy);
  let sx, sy, sdx, sdy;
  if (dx < 0) { sx = -1; sdx = (ox - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - ox) * ddx; }
  if (dy < 0) { sy = -1; sdy = (oy - my) * ddy; } else { sy = 1; sdy = (my + 1 - oy) * ddy; }
  let side = 0, t = 0;
  for (let i = 0; i < 80; i++) {
    if (sdx < sdy) { sdx += ddx; mx += sx; side = 0; } else { sdy += ddy; my += sy; side = 1; }
    if (mx < 0 || my < 0 || mx >= MW || my >= MH) { t = 1; break; }
    t = grid[my * MW + mx]; if (t) break;
  }
  rSide = side; rTile = t || 1;
  return side === 0 ? sdx - ddx : sdy - ddy;
}

function render(cam) {
  const amb=mode==='sandbox'?dayShade():1;
  const dirX = Math.cos(cam.a), dirY = Math.sin(cam.a);
  const plX = -dirY * PLANE, plY = dirX * PLANE;
  // floor & ceiling
  const r0x = dirX - plX, r0y = dirY - plY, r1x = dirX + plX, r1y = dirY + plY;
  for (let y = HALF; y < VH; y++) {
    const rowDist = (PROJ * 0.5) / (y - HALF + 0.5);
    const stx = rowDist * (r1x - r0x) / W, sty = rowDist * (r1y - r0y) / W;
    let fx = cam.x + rowDist * r0x, fy = cam.y + rowDist * r0y;
    const s = clamp(1.1 - rowDist / 11, 0.06, 1);
    const fRow = y * W, cRow = (VH - 1 - y) * W;
    for (let x = 0; x < W; x++) {
      const cx = Math.floor(fx), cy = Math.floor(fy);
      const ti = (((fy - cy) * TS) & 63) * TS + (((fx - cx) * TS) & 63);
      let c, s2=s*amb;
      if(mode==='sandbox'){
        let ft=3;
        if(cx>=0&&cy>=0&&cx<MW&&cy<MH){ft=floorG[cy*MW+cx];s2=Math.min(1.2,s*(ft===2?amb*0.4:amb)+torchLight[cy*MW+cx]/255);}
        c=(FLOORTEX[ft]||BLOCKS.dirt)[ti];
      }else c=(cx===exitX&&cy===exitY)?texExit[ti]:(cx<11&&cy<11?BLOCKS.planks:((Math.floor(cx/11)+Math.floor(cy/11))%3===0?BLOCKS.dirt:texFloor))[ti];
      buf[fRow + x] = 0xff000000 | (((c >> 16 & 255) * s2) << 16) | (((c >> 8 & 255) * s2) << 8) | ((c & 255) * s2);
      const lit=((cx * 7 + cy * 3) % 5 === 0);
      c = lit ? texCeilLight[ti] : texCeil[ti];
      const cs=(lit?Math.max(.65,s):s)*amb;
      buf[cRow + x] = 0xff000000 | (((c >> 16 & 255) * cs) << 16) | (((c >> 8 & 255) * cs) << 8) | ((c & 255) * cs);
      fx += stx; fy += sty;
    }
  }
  // walls
  for (let x = 0; x < W; x++) {
    const cam2 = 2 * x / W - 1;
    const rdx = dirX + plX * cam2, rdy = dirY + plY * cam2;
    const perp = Math.max(0.05, cast(cam.x, cam.y, rdx, rdy));
    zbuf[x] = perp;
    const lh = PROJ / perp, top = HALF - lh / 2;
    let wx = rSide === 0 ? cam.y + perp * rdy : cam.x + perp * rdx;
    wx -= Math.floor(wx);
    let tx = (wx * TS) | 0;
    if ((rSide === 0 && rdx > 0) || (rSide === 1 && rdy < 0)) tx = 63 - tx;
    const tex = WALLTEX[rTile];
    const s = clamp(1.2 - perp / 11, 0.07, 1) * (rSide ? 0.72 : 1) * amb;
    const y0 = Math.max(0, Math.ceil(top)), y1 = Math.min(VH, Math.ceil(top + lh));
    const step = TS / lh;
    let tp = (y0 - top) * step;
    for (let y = y0; y < y1; y++) {
      const c = tex[((tp | 0) & 63) * TS + tx];
      buf[y * W + x] = 0xff000000 | (((c >> 16 & 255) * s) << 16) | (((c >> 8 & 255) * s) << 8) | ((c & 255) * s);
      tp += step;
    }
  }
  // sprites
  const list = [];
  for (const e of enemies) {
    const t = TEX[e.type];
    const f = e.dead ? 3 : (e.atkT > 0 ? 2 : (Math.floor(e.anim) & 1));
    list.push({ x: e.x, y: e.y, tex: t[f], sc: e.type === 'exploder' ? .78 : .9, flash: !e.dead && e.flash > 0 });
  }
  for (const it of items) list.push({ x: it.x, y: it.y, tex: itemTex(it), sc: 0.5, bright:['quad','speed','invulnerable','xp'].includes(it.type) });
  for (const f of projectiles) list.push({ x: f.x, y: f.y, tex: f.rocket?TEX.rocket:TEX.arrow, sc: f.rocket?.3:.23, mid: true, bright: true });
  if(mode!=='sandbox') list.push({ x: exitX + 0.5, y: exitY + 0.5, tex: TEX.exitsign, sc: 0.75, bright: true });
  for(const t of torchList) list.push({x:t.x+.5,y:t.y+.5,tex:TEX.torch,sc:.42,bright:true});
  if (npc&&!npc.dead) list.push({ x: npc.x, y: npc.y, tex: TEX.dealer[state === 'shop' && (Math.floor(titleT * 3) & 1) ? 1 : 0], sc: 0.95, glow: true, flash:npc.flash>0 });
  for(const v of villagers) if(!v.dead) list.push({x:v.x,y:v.y,tex:TEX[v.tex],sc:.9,flash:v.flash>0});
  for (const s of list) { const rx = s.x - cam.x, ry = s.y - cam.y; s.depth = rx * dirX + ry * dirY; s.lat = -rx * dirY + ry * dirX; }
  list.sort((a, b) => b.depth - a.depth);
  for (const s of list) {
    if (s.depth < 0.2) continue;
    const sx = W / 2 + s.lat / s.depth * PROJ;
    const size = PROJ / s.depth * s.sc;
    const top = s.mid ? HALF - size / 2 : HALF + (PROJ * 0.5) / s.depth - size;
    const left = sx - size / 2;
    const x0 = Math.max(0, Math.ceil(left)), x1 = Math.min(W, Math.ceil(left + size));
    const y0 = Math.max(0, Math.ceil(top)), y1 = Math.min(VH, Math.ceil(top + size));
    if (x0 >= x1 || y0 >= y1) continue;
    const sh = s.bright ? 1 : clamp(1.2 - s.depth / 11, 0.08, 1) * amb;
    const tex = s.tex, inv = TS / size;
    for (let x = x0; x < x1; x++) {
      if (s.depth >= zbuf[x]) continue;
      const tx = ((x - left) * inv) | 0;
      for (let y = y0; y < y1; y++) {
        const c = tex[(((y - top) * inv) | 0) * TS + tx];
        if ((c >>> 24) < 128) continue;
        const ss = (s.glow && (c === GLOW[0] || c === GLOW[1])) ? 1 : sh;
        let r = (c & 255) * ss, g = (c >> 8 & 255) * ss, b = (c >> 16 & 255) * ss;
        if (s.flash) { r = Math.min(255, r + 150); g = Math.min(255, g + 150); b = Math.min(255, b + 150); }
        buf[y * W + x] = 0xff000000 | (b << 16) | (g << 8) | r;
      }
    }
  }
  ctx.putImageData(frame, 0, 0);
  for(const q of particles){const rx=q.x-cam.x,ry=q.y-cam.y,d=rx*dirX+ry*dirY;if(d<.2)continue;const x=W/2+(-rx*dirY+ry*dirX)/d*PROJ;if(x<0||x>=W||d>zbuf[x|0])continue;const y=HALF+(.5-q.z)*PROJ/d;ctx.fillStyle=q.color;const size=Math.min(14,Math.max(2,5/d));ctx.globalAlpha=Math.min(1,q.life*3);ctx.fillRect(x,y,size,size);}ctx.globalAlpha=1;
  if(shake>0){ctx.drawImage(cv,Math.sin(time*130)*shake*10,Math.cos(time*97)*shake*6);}

}

let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if(musicDuckTimer>0){musicDuckTimer-=dt;if(musicDuckTimer<=0){musicDuckTimer=0;try{if(musicWidget&&musicReady&&musicOn)musicWidget.setVolume(100);}catch(e){}}}
  const credit=document.getElementById('music-credit');if(credit)credit.hidden=state!=='title';
  fpsAcc += dt; fpsN++; if (fpsAcc >= 1) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  titleT += dt;
  if (state === 'play') update(dt);
  else if (state !== 'title') { // keep projectiles & flashes fading on end screens
    hurtFlash = Math.max(0, hurtFlash - dt); weapon.flash -= dt;
  }
  if (state === 'title') {
    render({ x: 6.5, y: 6.5, a: titleT * 0.15 });
    drawHUD(); drawTitle();
  } else {
    render(player);
    if (state !== 'dead' && state !== 'shop') drawWeapon();
    if (state === 'play') drawCrosshair();
    if (hurtFlash > 0) { ctx.fillStyle = `rgba(255,0,0,${hurtFlash * 0.5})`; ctx.fillRect(0, 0, W, VH); }
    if (pickFlash > 0) { ctx.fillStyle = `rgba(255,230,80,${pickFlash * 0.4})`; ctx.fillRect(0, 0, W, VH); }
    if (showMap) drawMinimap();
    if (msgT > 0 && state === 'play') { ctx.font = 'bold 13px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#000'; ctx.fillText(msgText, 9, 19); ctx.fillStyle = '#ff5040'; ctx.fillText(msgText, 8, 18); }
    if (state === 'play' && document.pointerLockElement !== cv) { ctx.font = '11px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#aaa'; ctx.fillText('click to capture mouse', W - 8, VH - 8); }
    drawHUD();
    if (state === 'dead') drawEnd(false);
    if (state === 'win') drawEnd(true);
    if (state === 'shop') drawShop();
    if(state==='skills')drawSkills();
    if(state==='dialogue')drawDialogue();
    if(state==='craft')drawCraft();
    if(state==='chest')drawChest();
    if(state==='pause')drawPause();
  }
  if(state==='leaderboard')drawLeaderboard();
  requestAnimationFrame(loop);
}

function prepActor(v,name,role){if(!v)return;v.kind='npc';v.name=name||v.name||'Villager';v.role=role||v.role||'hint';if(v.hp==null)v.hp=v.role==='dealer'?90:v.role==='guard'?70:50;if(v.gold==null)v.gold=v.role==='dealer'?48:v.role==='guard'?18:16;v.a=v.a||0;v.dead=!!v.dead;v.hostile=!!v.hostile;v.inv=v.inv||[{id:5,n:2}];}
function aimCell(){for(const dist of [1.05,1.6]){const x=Math.floor(player.x+Math.cos(player.a)*dist),y=Math.floor(player.y+Math.sin(player.a)*dist);if(x!==(player.x|0)||y!==(player.y|0))return {x,y};}return null;}
function occupied(x,y){if(Math.abs(player.x-(x+.5))<.45&&Math.abs(player.y-(y+.5))<.45)return true;if(npc&&!npc.dead&&(npc.x|0)===x&&(npc.y|0)===y)return true;return villagers.some(v=>!v.dead&&(v.x|0)===x&&(v.y|0)===y);}
function chestAt(x,y){return chestList.find(c=>c.x===x&&c.y===y);}
function bakeTorches(){torchLight.fill(0);for(const t of torchList){for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++){const d=Math.hypot(x,y);if(d>6)continue;const ix=t.x+x,iy=t.y+y;if(ix<0||iy<0||ix>=MW||iy>=MH)continue;const i=iy*MW+ix,v=(1-d/6)*220|0;if(v>torchLight[i])torchLight[i]=v;}}}
function refreshTurrets(){turretList=[];for(let i=0;i<grid.length;i++)if(grid[i]===14)turretList.push({x:(i%MW)+.5,y:(i/MW|0)+.5,cd:0});}
function spillChest(ch){if(!ch||ch.spilled)return;ch.spilled=1;if(ch.gold)items.push({type:'coins',n:ch.gold,x:ch.x+.5,y:ch.y+.5});for(const it of ch.loot||[])items.push({type:'block',id:it.id,n:it.n||1,x:ch.x+.5,y:ch.y+.5});ch.loot=[];ch.gold=0;}
function punishChest(ch){if(!ch||!ch.village||ch.punished)return;ch.punished=1;addRep(-12);alertVillage=true;for(const v of villagers)if(!v.dead)v.hostile=true;if(npc&&!npc.dead)npc.hostile=true;msg('The village saw the theft. REP '+rep);}
function takeChest(){const ch=chestRef;if(!ch)return;if(ch.village)punishChest(ch);if(ch.gold){player.gold+=ch.gold|0;ch.gold=0;}for(const it of ch.loot||[])addItem(it.id,it.n||1);ch.loot=[];ch.taken=1;ch.spilled=1;msg('Chest emptied.');state='play';lockPointer();}
function nearTable(){const x=player.x|0,y=player.y|0;for(let yy=-2;yy<=2;yy++)for(let xx=-2;xx<=2;xx++){const tx=x+xx,ty=y+yy;if(tx<0||ty<0||tx>=MW||ty>=MH)continue;if(grid[ty*MW+tx]===12)return true;}return false;}
function canCraft(r){if(!r)return false;if(r.table&&!nearTable())return false;return r.need.every(([id,n])=>(bag[id]|0)>=n);}
function doCraft(i){const r=RECIPES[i];if(!r)return false;if(r.table&&!nearTable()){msg('Set down a crafting table first.');return false;}if(!canCraft(r)){msg('Missing materials.');return false;}for(const [id,n] of r.need)addItem(id,-n);addItem(r.out,r.n);sfx('pick');msg('Crafted '+INAME[r.out]+'.');return true;}
function mineCell(x,y){if(mode!=='sandbox'||mineCD>0)return false;x|=0;y|=0;if(x<1||y<1||x>=MW-1||y>=MH-1){msg('The world edge holds.');return false;}const ti=torchList.findIndex(t=>t.x===x&&t.y===y);if(ti>=0&&!grid[y*MW+x]){torchList.splice(ti,1);addItem(12,1);bakeTorches();mineCD=.18;sfx('click');return true;}const t=grid[y*MW+x];if(!t){msg('Nothing to mine.');return false;}if(t===13){const ch=chestAt(x,y);if(ch){if(ch.village)punishChest(ch);spillChest(ch);chestList=chestList.filter(c=>c!==ch);}}const drop=TDROP[t]||0;grid[y*MW+x]=0;built[y*MW+x]=0;builtHp[y*MW+x]=0;if(t===15)openDoors.delete(y*MW+x);if(drop)addItem(drop,1);if(t===14)refreshTurrets();mineCD=.18;sfx('click');burst(x+.5,y+.5,'#c8b090',6);return true;}
function mineBlock(){const c=aimCell();if(!c){msg('Face a block.');return false;}return mineCell(c.x,c.y);}
function placeCell(x,y){if(mode!=='sandbox')return false;x|=0;y|=0;const id=hotbar[hotSel]|0;if(!id||!(bag[id]>0)){msg('Empty slot. Press B, then 1-8.');return false;}if(x<1||y<1||x>=MW-1||y>=MH-1)return false;if(occupied(x,y)){msg('Something is in the way.');return false;}if(id===12){if(torchList.some(t=>t.x===x&&t.y===y)){msg('A torch is already there.');return false;}if(torchList.length>=80){msg('Too many torches.');return false;}torchList.push({x,y});addItem(12,-1);bakeTorches();sfx('pick');return true;}const tile=TPLACE[id];if(!tile){msg(INAME[id]+' cannot be placed.');return false;}const i=y*MW+x;if(grid[i]){msg('A block is already there.');return false;}grid[i]=tile;built[i]=1;builtHp[i]=tile===14?160:tile===15?70:100;addItem(id,-1);if(tile===13)chestList.push({x,y,loot:[],village:0,taken:0,gold:0,spilled:0,punished:0});if(tile===14)refreshTurrets();sfx('pick');return true;}
function placeBlock(){const c=aimCell();if(!c)return false;return placeCell(c.x,c.y);}
function facingYou(v){let a=Math.atan2(player.y-v.y,player.x-v.x)-(v.a||0);a=Math.atan2(Math.sin(a),Math.cos(a));return Math.abs(a)<1.05;}
function nearestNPC(){let best=null,bd=1.75;const list=villagers.filter(v=>v&&!v.dead);if(npc&&!npc.dead)list.push(npc);for(const v of list){const d=Math.hypot(v.x-player.x,v.y-player.y);if(d<bd){bd=d;best=v;}}return best;}
function trySteal(){const v=nearestNPC();if(!v){msg('Nobody close enough to pickpocket.');return false;}let chance=0.26+Math.min(.34,level*.025)+(skills[8]?.12:0)+(skills[11]?.08:0);if(facingYou(v))chance*=.2;if(Math.random()<chance){if((v.gold||0)>=8){v.gold-=8;player.gold+=8;msg('Lifted 8 gold from '+v.name+'.');}else if(v.inv&&v.inv.length){const it=v.inv.pop();addItem(it.id,it.n||1);msg('Stole '+INAME[it.id]+' from '+v.name+'.');}else msg(v.name+' has nothing left.');sfx('pick');return true;}addRep(-15);v.hostile=true;msg(v.name+' catches your hand. REP '+rep+'.');sfx('click');return false;}
function killNPC(v){v.dead=true;v.hostile=true;if(v.gold)items.push({type:'coins',n:v.gold,x:v.x,y:v.y});for(const it of v.inv||[])items.push({type:'block',id:it.id,n:it.n||1,x:v.x+(Math.random()-.5)*.3,y:v.y+(Math.random()-.5)*.3});addRep(v.role==='dealer'?-40:-25);alertVillage=true;for(const o of villagers)if(o!==v&&!o.dead)o.hostile=true;if(npc&&npc!==v&&!npc.dead)npc.hostile=true;msg((v.name||'They')+' fell. The others turn on you. REP '+rep);sfx('die');}
function hurtNPC(v,d){if(!v||v.dead)return;v.hp-=d;v.flash=.16;v.hostile=true;burst(v.x,v.y,'#e8c8a0',8);if(v.hp<=0)killNPC(v);else sfx('pain');}
function priced(c){if(c==null)return null;if(mode==='sandbox'&&rep<70)return Math.ceil(c*1.5);return c;}
function cycleHot(d){hotSel=(hotSel+d+80)%8;}
function itemTex(it){if(!it)return TEX.gold;if(it.type==='gun')return TEX['gun'+it.gun]||TEX.gold;if(it.type==='ammo'||it.ammo)return TEX['ammo_'+(it.ammo||'rounds')]||TEX.ammo;if(it.type==='coins'||it.type==='gold')return TEX.gold;if(it.type==='block'){const tile=TPLACE[it.id];if(tile&&WALLTEX[tile])return WALLTEX[tile];if(it.id===13)return BLOCKS.coal;if(it.id===14||it.id===9)return BLOCKS.gold;if(it.id===15)return BLOCKS.diamond;return BLOCKS.planks;}return TEX[it.type]||TEX.gold;}
function updateNPCs(dt){const list=villagers.slice();if(npc)list.push(npc);for(const v of list){if(!v||v.dead)continue;v.flash=Math.max(0,(v.flash||0)-dt);if(v.role==='guard'&&rep<35)v.hostile=true;v.cd=(v.cd||0)-dt;if(v.hostile){const dx=player.x-v.x,dy=player.y-v.y,d=Math.hypot(dx,dy)||1;v.a=Math.atan2(dy,dx);if(d>0.95&&d<16)moveEnt(v,dx/d*1.7*dt,dy/d*1.7*dt,.28);if(d<1.05&&v.cd<=0){v.cd=1;damagePlayer(v.role==='guard'?14:8);sfx('claw');}}else v.a=(v.a||0)+dt*.25;}}
function updateTurrets(dt){for(const t of turretList){t.cd-=dt;if(t.cd>0)continue;let best=null,bd=8.5;for(const e of enemies){if(e.dead)continue;const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<bd&&los(t.x,t.y,e.x,e.y)){bd=d;best=e;}}if(best){t.cd=.9;hurtEnemy(best,14);burst(t.x,t.y,'#ffd080',3);}}}
function biteWalls(dt){for(const e of enemies){if(e.dead)continue;const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;const x=Math.floor(e.x+dx/d*.85),y=Math.floor(e.y+dy/d*.85);if(x<0||y<0||x>=MW||y>=MH)continue;const i=y*MW+x;if(!built[i]||!grid[i])continue;builtHp[i]=Math.max(0,(builtHp[i]||1)-22*dt);if(builtHp[i]<=0){if(grid[i]===13)chestList=chestList.filter(c=>c.x!==x||c.y!==y);if(grid[i]===15)openDoors.delete(i);grid[i]=0;built[i]=0;if(grid[i]===14){} refreshTurrets();msg('They broke a piece of your base.');}}}
function trySpawn(){if(mode!=='sandbox'||state!=='play')return;const alive=enemies.reduce((n,e)=>n+(!e.dead),0);const night=dayShade()<0.45,cave=(()=>{const x=player.x|0,y=player.y|0;return x>=0&&y>=0&&x<MW&&y<MH&&floorG[y*MW+x]===2;})();const cap=cave?10:night?8:2;if(alive>=cap)return;if(!night&&!cave&&Math.random()>.35)return;const ang=Math.random()*6.2832,dist=9+Math.random()*7;const x=player.x+Math.cos(ang)*dist,y=player.y+Math.sin(ang)*dist;if(x<2||y<2||x>=MW-2||y>=MH-2||solid(x,y))return;const ft=floorG[(y|0)*MW+(x|0)];if(ft===3)return;if(!cave&&Math.hypot(x-spawnX,y-spawnY)<14)return;const type=cave&&Math.random()<.45?'skeleton':Math.random()<.18?'exploder':'zombie';const e=mkEnemy(type,x,y);e.alert=true;enemies.push(e);}
function sandboxTick(dt){if(mode!=='sandbox')return;clock+=dt;mineCD=Math.max(0,mineCD-dt);saveT-=dt;if(saveT<=0){saveT=8;saveWorld();}spawnT-=dt;if(spawnT<=0){spawnT=1.15;trySpawn();}updateNPCs(dt);updateTurrets(dt);biteWalls(dt);if(enemies.length>28)enemies=enemies.filter(e=>!e.dead||Math.hypot(e.x-player.x,e.y-player.y)<18);}
function sandboxUse(){for(const v of villagers)if(!v.dead&&Math.hypot(v.x-player.x,v.y-player.y)<1.9){if(v.hostile){msg(v.name+' will not talk.');return;}talkTo(v);return;}if(npc&&!npc.dead&&Math.hypot(npc.x-player.x,npc.y-player.y)<1.8){if(npc.hostile||tradeClosed()){msg('Corvin will not trade with you.');return;}openShop();return;}const cell=aimCell();if(!cell){sfx('click');return;}const t=tileAt(cell.x,cell.y),i=cell.y*MW+cell.x;if(t===15){if(openDoors.has(i))openDoors.delete(i);else openDoors.add(i);sfx('door');msg(openDoors.has(i)?'Door open':'Door shut');return;}if(t===13){const ch=chestAt(cell.x,cell.y);if(ch){chestRef=ch;state='chest';unlock();mouseDown=false;for(const k in keys)keys[k]=false;return;}}if(t===12){state='craft';craftSel=0;unlock();mouseDown=false;for(const k in keys)keys[k]=false;return;}sfx('click');}
function clearDisc(cx,cy,r){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){if(x*x+y*y>r*r)continue;const xx=cx+x,yy=cy+y;if(xx<2||yy<2||xx>=MW-2||yy>=MH-2)continue;floorG[yy*MW+xx]=0;grid[yy*MW+xx]=0;}}
function house(x,y,loot){const w=7,h=6;for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const xx2=x+xx,yy2=y+yy;if(xx2<2||yy2<2||xx2>=MW-2||yy2>=MH-2)continue;floorG[yy2*MW+xx2]=5;grid[yy2*MW+xx2]=(xx===0||yy===0||xx===w-1||yy===h-1)?4:0;}const dx=x+3,dy=y+h-1;if(dx>1&&dy>1&&dx<MW-1&&dy<MH-1)grid[dy*MW+dx]=15;const cx=x+2,cy=y+2;if(cx>1&&cy>1){grid[cy*MW+cx]=13;chestList.push({x:cx,y:cy,loot:loot,village:1,taken:0,gold:22,spilled:0,punished:0});}const tx=x+4,ty=y+2;if(tx>1&&ty>1&&tx<MW-1)grid[ty*MW+tx]=12;torchList.push({x:x+1,y:y+h});}
function placeVillage(cx,cy,kind){clearDisc(cx,cy,12);house(cx-9,cy-8,[{id:13,n:3},{id:7,n:8},{id:12,n:2}]);if(kind==='main'){house(cx+3,cy-7,[{id:14,n:2},{id:5,n:6}]);house(cx-8,cy+3,[{id:15,n:1},{id:7,n:4}]);spawnX=cx+.5;spawnY=cy+.5;npc={x:cx+2.2,y:cy+.5,greeted:false};prepActor(npc,'Corvin','dealer');villagers.push({x:cx-1.4,y:cy+2.2,role:'quest',tex:'villager1',name:'Mara'});villagers.push({x:cx+1.2,y:cy-2.2,role:'hint',tex:'villager2',name:'Ivo'});villagers.push({x:cx+.5,y:cy+5.2,role:'guard',tex:'villager2',name:'Bram'});villagers.push({x:cx-2.2,y:cy-1.2,role:'guard',tex:'villager1',name:'Sela'});items.push({type:'gun',gun:2,x:cx+1.2,y:cy+1.1});items.push({type:'ammo',ammo:'rifle',x:cx-1.1,y:cy+.8});}else{const who=kind==='east'?['Nell','villager1']:['Pim','villager2'];villagers.push({x:cx+.4,y:cy+1.6,role:'hint',tex:who[1],name:who[0]});villagers.push({x:cx+2.2,y:cy-1.4,role:'guard',tex:'villager2',name:kind==='east'?'Otto':'Nia'});}for(const v of villagers)if(!v.kind)prepActor(v,v.name,v.role);}
function buildWorld(seed){worldSeed=seed|0||1;mode='sandbox';allocWorld(WORLD);freshRunLists();bag={4:6,12:4};hotbar=[4,5,1,3,7,8,12,16];hotSel=0;rep=100;alertVillage=false;clock=22;buildMode=false;currentGun=0;owned=[true,true,false,false,false,false];ammo={rounds:90,shells:24,rifle:0,heavy:0,rockets:0,cells:0};gunUp=[0,0,0,0,0,0];level=1;xp=0;skillPoints=0;skills=Array(12).fill(false);powers={quad:0,speed:0,invulnerable:0};for(let y=0;y<WORLD;y++)for(let x=0;x<WORLD;x++){const i=y*WORLD+x;if(x<1||y<1||x>=WORLD-1||y>=WORLD-1){grid[i]=2;floorG[i]=2;continue;}const e=elev(x,y),n=h32(x,y,worldSeed);if(e<0.34){floorG[i]=3;continue;}if(e<0.4){floorG[i]=4;continue;}if(e>=0.72){floorG[i]=2;if(!(vn(x/4.5,y/4.5,worldSeed+4)>0.6)){const r=n%46;grid[i]=r===0?9:r===1?3:r===2?11:2;}}else{floorG[i]=0;if(e>0.48&&e<0.66&&n%37===0)grid[i]=5;else if(e>0.5&&e<0.64&&n%71===3)grid[i]=11;}}const spots=[[48,48],[150,50],[76,148]];const kinds=['main','east','south'];for(let i=0;i<3;i++){const jx=(h32(i,3,worldSeed)%9)-4,jy=(h32(i,4,worldSeed)%9)-4;placeVillage(spots[i][0]+jx,spots[i][1]+jy,kinds[i]);}makePlayer(spawnX,spawnY);baseGrid=grid.slice(0);bakeTorches();refreshTurrets();msg('Sandbox seed '+worldSeed+'. Right click mines. B builds.');}
function freshRunLists(){enemies=[];items=[];projectiles=[];particles=[];villagers=[];npc=null;torchList=[];chestList=[];turretList=[];openDoors=new Set();kills=0;total=0;quest={active:false,kills:0,claimed:false};runSaved=false;runName='';}
function makePlayer(x,y){player={x,y,a:.2,hp:100,armor:0,gold:40,bob:0,moving:false};Object.defineProperty(player,'ammo',{get:()=>ammo.shells,set:v=>ammo.shells=v});}
function worldSaved(){try{const d=JSON.parse(localStorage.getItem('blockfall-world')||'');return !!(d&&d.v===1&&d.seed);}catch(e){return false;}}
function saveWorld(){if(mode!=='sandbox'||!worldSeed||!baseGrid)return;const edits=[];for(let i=0;i<grid.length;i++)if(grid[i]!==baseGrid[i]||built[i])edits.push([i,grid[i],built[i],builtHp[i]]);const npcs=[];for(const v of villagers)npcs.push({name:v.name,hp:v.hp,dead:v.dead?1:0,hostile:v.hostile?1:0,gold:v.gold|0});const data={v:1,seed:worldSeed,clock,rep,alert:alertVillage?1:0,px:player.x,py:player.y,pa:player.a,hp:player.hp,armor:player.armor,gold:player.gold,level,xp,sp:skillPoints,skills,owned,gunUp,ammo,currentGun,bag,hotbar,hotSel,edits,doors:[...openDoors],torches:torchList.map(t=>[t.x,t.y]),chests:chestList,npcs,corvin:npc?{hp:npc.hp,dead:npc.dead?1:0,hostile:npc.hostile?1:0,gold:npc.gold|0,x:npc.x,y:npc.y}:null};try{localStorage.setItem('blockfall-world',JSON.stringify(data));}catch(e){msg('Could not save the world.');}}
function loadWorld(){let data;try{data=JSON.parse(localStorage.getItem('blockfall-world')||'');}catch(e){return false;}if(!data||data.v!==1||!data.seed)return false;buildWorld(data.seed|0);for(const ed of data.edits||[]){const i=ed[0]|0;if(i<0||i>=grid.length)continue;grid[i]=ed[1]|0;built[i]=ed[2]?1:0;builtHp[i]=ed[3]|0;}if(data.bag)bag=data.bag;if(Array.isArray(data.hotbar)&&data.hotbar.length===8)hotbar=data.hotbar.map(n=>n|0);hotSel=clamp(data.hotSel|0,0,7);rep=clamp(data.rep??100,0,100)|0;alertVillage=!!data.alert;clock=Number.isFinite(data.clock)?data.clock:22;if(Array.isArray(data.skills)&&data.skills.length===12)skills=data.skills.map(Boolean);level=data.level|0||1;xp=data.xp|0;skillPoints=data.sp|0;if(Array.isArray(data.owned)&&data.owned.length===6)owned=data.owned.map(Boolean);if(Array.isArray(data.gunUp)&&data.gunUp.length===6)gunUp=data.gunUp.map(n=>n|0);if(data.ammo)ammo=Object.assign({rounds:0,shells:0,rifle:0,heavy:0,rockets:0,cells:0},data.ammo);currentGun=clamp(data.currentGun|0,0,5);if(!owned[currentGun])currentGun=0;openDoors=new Set((data.doors||[]).map(n=>n|0));torchList=(data.torches||[]).filter(t=>Array.isArray(t)).map(t=>({x:t[0]|0,y:t[1]|0}));if(Array.isArray(data.chests))chestList=data.chests;const by={};for(const n of data.npcs||[])by[n.name]=n;for(const v of villagers){const s=by[v.name];if(!s)continue;v.hp=s.hp;v.dead=!!s.dead;v.hostile=!!s.hostile;v.gold=s.gold|0;}if(npc&&data.corvin){npc.hp=data.corvin.hp;npc.dead=!!data.corvin.dead;npc.hostile=!!data.corvin.hostile;npc.gold=data.corvin.gold|0;if(Number.isFinite(data.corvin.x)){npc.x=data.corvin.x;npc.y=data.corvin.y;}}player.x=Number.isFinite(data.px)?data.px:spawnX;player.y=Number.isFinite(data.py)?data.py:spawnY;player.a=data.pa||0;player.hp=data.hp>0?data.hp:100;player.armor=data.armor|0;player.gold=data.gold|0;if(solid(player.x,player.y)){player.x=spawnX;player.y=spawnY;}bakeTorches();refreshTurrets();msg('World '+worldSeed+' loaded.');return true;}

function respawn(){player.hp=maxHP();player.armor=Math.max(0,player.armor-10);player.x=spawnX;player.y=spawnY;msg('You wake at the village. The base is still here.');}
function drawCraft(){ctx.fillStyle='rgba(8,16,22,.94)';ctx.fillRect(70,24,500,300);centerText('CRAFT',48,22,'#f0d18e','monospace');ctx.font='12px monospace';ctx.textAlign='left';RECIPES.forEach((r,i)=>{const y=78+i*28,ok=canCraft(r);if(i===craftSel){ctx.fillStyle='#2c4250';ctx.fillRect(86,y-14,468,24);}ctx.fillStyle=ok?'#d7ecdf':'#7d8d86';const need=r.need.map(([id,n])=>n+' '+INAME[id]).join(' + ');ctx.fillText((i===craftSel?'> ':'  ')+r.name+'  x'+r.n+'   '+need+(r.table?'  (table)':''),96,y);});ctx.textAlign='center';ctx.fillStyle='#b7c9be';ctx.fillText('W/S choose   ENTER craft   C/ESC close',320,308);}
function drawChest(){const ch=chestRef||{loot:[],gold:0,village:0};ctx.fillStyle='rgba(8,16,22,.94)';ctx.fillRect(90,70,460,200);centerText(ch.village?'VILLAGE CHEST':'CHEST',96,20,'#f0d18e','monospace');ctx.font='13px monospace';ctx.textAlign='left';ctx.fillStyle='#e6d7a8';let y=132;if(ch.gold){ctx.fillText(ch.gold+' gold',120,y);y+=20;}if(!(ch.loot||[]).length&&!ch.gold){ctx.fillStyle='#9aab9f';ctx.fillText('Empty.',120,y);}for(const it of ch.loot||[]){ctx.fillText((it.n||1)+' '+INAME[it.id],120,y);y+=20;}ctx.textAlign='center';ctx.fillStyle='#b7c9be';ctx.fillText('ENTER take all   ESC leave',320,250);}
function drawPause(){ctx.fillStyle='rgba(6,12,16,.9)';ctx.fillRect(120,70,400,200);centerText('PAUSED',108,26,'#f0d18e','monospace');ctx.font='14px monospace';ctx.textAlign='center';ctx.fillStyle='#d5e4da';ctx.fillText('ENTER resume',320,160);ctx.fillText('T save and title',320,186);ctx.fillText('U new sandbox world',320,212);ctx.font='11px monospace';ctx.fillStyle='#93a79c';ctx.fillText(mode==='sandbox'?'Seed '+worldSeed:'Campaign fortress',320,244);}
function drawLocalMap(){const s=5,rad=14,ox=W-(rad*2+1)*s-8,oy=8;ctx.globalAlpha=.82;ctx.fillStyle='#000';ctx.fillRect(ox-2,oy-2,(rad*2+1)*s+4,(rad*2+1)*s+4);const px=player.x|0,py=player.y|0;for(let y=-rad;y<=rad;y++)for(let x=-rad;x<=rad;x++){const wx=px+x,wy=py+y;let col='#102416';if(wx<0||wy<0||wx>=MW||wy>=MH)col='#000';else{const t=grid[wy*MW+wx],f=floorG[wy*MW+wx];col=t?(MINI[t]||'#999'):(f===3?'#1d4e86':f===2?'#4e514e':f===4?'#c2b48a':f===5?'#8d6840':f===1?'#6a4a2a':'#2c6a34');}ctx.fillStyle=col;ctx.fillRect(ox+(x+rad)*s,oy+(y+rad)*s,s-1,s-1);}ctx.fillStyle='#ffee66';ctx.fillRect(ox+rad*s,oy+rad*s,s,s);ctx.globalAlpha=1;}

// ================= INPUT =================
window.addEventListener('keydown',e=>{
 if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if((state==='win'||state==='dead')&&entryMode){e.preventDefault();if(e.code==='Enter')saveRun();else if(e.code==='Escape')entryMode=false;else if(e.code==='Backspace')runName=runName.slice(0,-1);else if(e.key.length===1&&/^[a-zA-Z0-9 _-]$/.test(e.key)&&runName.length<12)runName+=e.key;return;}
 if(e.code==='KeyN'&&!e.repeat){toggleMusic();return;}
 if(e.code==='KeyC'&&['leaderboard','win','dead'].includes(state)){if(confirm('Clear all local leaderboard scores? This cannot be undone.')){scoreRows=[];try{localStorage.removeItem('blockfall-scores');}catch(e){}}return;}
 if(state==='leaderboard'){if(e.code==='KeyT'){if(!e.repeat){boardView=boardView==='local'?'global':'local';if(boardView==='global')loadGlobal();}return;}if(e.code==='Escape'||e.code==='KeyL')state=scoreReturn;return;}
 if(e.code==='KeyL'&&['title','win','dead','pause'].includes(state)){scoreReturn=state==='pause'?'play':state;boardView='global';state='leaderboard';loadGlobal();return;}
 if(state==='craft'){if(e.code==='Escape'||e.code==='KeyC'){state='play';lockPointer();return;}if(e.code==='KeyW'||e.code==='ArrowUp')craftSel=(craftSel+RECIPES.length-1)%RECIPES.length;else if(e.code==='KeyS'||e.code==='ArrowDown')craftSel=(craftSel+1)%RECIPES.length;else if(e.code==='Enter'||e.code==='Space')doCraft(craftSel);return;}
 if(state==='chest'){if(e.code==='Escape'||e.code==='KeyE'){state='play';lockPointer();return;}if(e.code==='Enter'||e.code==='Space')takeChest();return;}
 if(state==='pause'){if(e.code==='Enter'||e.code==='Escape'){state='play';lockPointer();return;}if(e.code==='KeyT'){toTitle();return;}if(e.code==='KeyU'){newWorld();return;}return;}
 if(state==='skills'){if(['KeyK','Tab','Escape'].includes(e.code)){state='play';lockPointer();}return;}
 if(state==='dialogue'){if(['KeyE','Enter','Escape'].includes(e.code)){state='play';lockPointer();}return;}
 if(state==='shop'){if(e.repeat)return;if(e.code==='KeyE'||e.code==='Escape')closeShop();else if(e.code==='KeyW'||e.code==='ArrowUp')shopSel=(shopSel+SHOP.length-1)%SHOP.length;else if(e.code==='KeyS'||e.code==='ArrowDown')shopSel=(shopSel+1)%SHOP.length;else if(e.code==='Enter'||e.code==='Space')buyItem(shopSel);return;}
 if(state==='title'){if(e.code==='Enter'||e.code==='Space')loadOrNew();else if(e.code==='KeyU')newWorld();else if(e.code==='KeyC')startCampaign();return;}
 if(state==='dead'||state==='win'){if(e.code==='KeyR'||e.code==='Enter')startCampaign();return;}
 if(e.code==='Escape'&&state==='play'){if(mode==='sandbox')saveWorld();state='pause';unlock();mouseDown=false;for(const k in keys)keys[k]=false;return;}
 if(state!=='play')return;keys[e.code]=true;
 if(e.code==='KeyR'&&!e.repeat){if(mode==='sandbox')respawn();else startCampaign();return;}
 if(e.code==='KeyM'&&!e.repeat)showMap=!showMap;
 if(e.code==='KeyB'&&!e.repeat&&mode==='sandbox'){buildMode=!buildMode;msg(buildMode?'Build mode':'Gun mode');return;}
 if(e.code==='KeyF'&&!e.repeat){trySteal();return;}
 if(e.code==='KeyC'&&!e.repeat&&mode==='sandbox'){state='craft';craftSel=0;unlock();mouseDown=false;for(const k in keys)keys[k]=false;return;}
 if(/^Digit[1-8]$/.test(e.code)&&!e.repeat&&mode==='sandbox'&&buildMode){hotSel=+e.code.slice(5)-1;return;}
 if(/^Digit[1-6]$/.test(e.code)&&!e.repeat)switchGun(+e.code[5]-1);
 if(e.code==='KeyE'&&!e.repeat)useAction();
 if(['KeyK','Tab'].includes(e.code)&&!e.repeat){state='skills';mouseDown=false;for(const k in keys)keys[k]=false;unlock();}
 if(e.code==='KeyQ'&&!e.repeat&&skills[9]&&dashCD<=0){dashT=.22;dashCD=3;tone('sine',200,800,.14,.1);}
});
window.addEventListener('keyup',e=>keys[e.code]=false);
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseDown=false;});
cv.addEventListener('wheel',e=>{e.preventDefault();if(state==='play'&&mode==='sandbox'&&buildMode)cycleHot(e.deltaY>0?1:-1);else if(state==='play')cycleGun(e.deltaY>0?1:-1);},{passive:false});
cv.addEventListener('mousedown',e=>{
 initAudio();
 if(e.button===2){if(state==='play'&&mode==='sandbox'){if(document.pointerLockElement!==cv){lockPointer();return;}mineBlock();}return;}
 if(e.button!==0)return;
 if(state==='skills'){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const col=Math.floor((x-22)/205),tier=Math.floor((y-94)/54);if(col>=0&&col<3&&tier>=0&&tier<4&&x-(22+col*205)<184&&y-(94+tier*54)<43)purchaseSkill(col*4+tier);return;}
 if(state==='title'){loadOrNew();return;}
 if(state!=='play')return;
 if(document.pointerLockElement!==cv){lockPointer();return;}
 if(mode==='sandbox'&&buildMode){placeBlock();return;}
 mouseDown=true;shoot();
});
window.addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false;});
document.addEventListener('mousemove',e=>{if(state==='play'&&document.pointerLockElement===cv)player.a+=e.movementX*.0025;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

initLevel();
// small debug hook (used for automated testing)
window.__game={get state(){return state;},get player(){return player;},get enemies(){return enemies;},get items(){return items;},get fps(){return fps;},get ammo(){return ammo;},get currentGun(){return currentGun;},get owned(){return owned;},get skills(){return skills;},get skillPoints(){return skillPoints;},get level(){return level;},get quest(){return quest;},get powers(){return powers;},get villagers(){return villagers;},get grid(){return grid;},get projectiles(){return projectiles;},get scores(){return scoreRows;},get gunUp(){return gunUp;},get shop(){return SHOP;},get npc(){return npc;},get boardStatus(){return globalStatus;},get boardRows(){return globalRows;},get boardFallen(){return globalFallen;},get boardView(){return boardView;},get onlineNote(){return onlineNote;},get time(){return time;},get musicOn(){return musicOn;},get musicReady(){return musicReady;},formatDate:formatScoreDate,openShop,buyItem,closeShop,damagePlayer,start:loadOrNew,campaign:startCampaign,newWorld,saveWorld,loadWorld,mineCell,placeCell,trySteal,doCraft,hurtNPC,get mode(){return mode;},get rep(){return rep;},get bag(){return bag;},get seed(){return worldSeed;},get buildMode(){return buildMode;},get hotbar(){return hotbar;},get clock(){return clock;},get alert(){return alertVillage;},switchGun,shoot,update,purchaseSkill,grantXP,collect,talkTo,hurtEnemy,render};
// SoundCloud widget. The track stays on SoundCloud; a missing player never stops the game.
let musicOn=true,musicArmed=false,musicReady=false,musicWidget=null,musicDuckTimer=0;
try{musicOn=localStorage.getItem('blockfall-music')!=='0';}catch(e){}
function applyMusic(){if(!musicWidget||!musicReady)return;try{if(!musicOn||!musicArmed){musicWidget.pause();return;}musicWidget.setVolume(musicDuckTimer>0?70:100);musicWidget.play();}catch(e){}}
function armMusic(){musicArmed=true;applyMusic();}
function toggleMusic(){musicOn=!musicOn;try{localStorage.setItem('blockfall-music',musicOn?'1':'0');}catch(e){}if(musicOn&&state!=='title')musicArmed=true;applyMusic();if(state==='play')msg(musicOn?'Music on':'Music off');}
function duckMusic(){if(!musicOn||!musicReady||!musicWidget)return;const held=musicDuckTimer>0;musicDuckTimer=.2;if(!held){try{musicWidget.setVolume(70);}catch(e){}}}
function initMusic(){try{if(musicWidget||!window.SC||!SC.Widget||!SC.Widget.Events)return;const frame=document.getElementById('sc-player');if(!frame)return;const widget=SC.Widget(frame);musicWidget=widget;widget.bind(SC.Widget.Events.READY,()=>{musicReady=true;try{widget.setVolume(100);}catch(e){}if(musicArmed&&musicOn){try{widget.play();}catch(e){}}});widget.bind(SC.Widget.Events.FINISH,()=>{if(!musicOn||!musicArmed)return;try{widget.seekTo(0);widget.play();}catch(e){}});}catch(e){musicWidget=null;musicReady=false;}}
window.__initMusic=initMusic;
if(window.SC&&SC.Widget)initMusic();
requestAnimationFrame(loop);
</script>
